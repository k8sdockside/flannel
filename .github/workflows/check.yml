name: check

# Loads the plugin the way K8s Dockside does and fails on anything the app
# would refuse: the JSON, every field, the kinds, the queries, the icons, the
# links, the versions, and every page the manifest opens.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check the plugin
        # Pinned to the release this plugin's minAppVersion names, not to
        # main: the check then matches the app the manifest claims to work
        # with, and it does not depend on the Go module proxy having caught up
        # with the app's branch. Bump it when minAppVersion goes up.
        run: go run github.com/k8sdockside/k8sdockside/cmd/plugincheck@v0.1.1 .
